<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>
        Add Element
    </button>

    <script>
        const addElement = document.querySelector("button") 
        addElement.addEventListener("click", () => {
            const newElement = document.createElement("p");
            newElement.textContent = "this is a dynamic Element"
            document.body.appendChild(newElement)
        } )
    </script>

    <div>
        <label for="bdate">Birthdate</label>
        <input type="date" name="" id="">
    </div>
<br>
    <div>
        <table style="border: 2px solid #000; border-collapse: collapse; width: 100%; text-align: center;">
            <thead style="background-color: green">
                <tr>
                    <th style="border: 1px solid #000; padding: 8px;">Sunday</th>
                    <th style="border: 1px solid #000; padding: 8px;">Monday</th>
                    <th style="border: 1px solid #000; padding: 8px;">Tuesday</th>
                    <th style="border: 1px solid #000; padding: 8px;">Wednesday</th>
                    <th style="border: 1px solid #000; padding: 8px;">Thursday</th>
                </tr>
            </thead>
            <tbody style="background-color: lightgreen;">
                <tr>
                    <td style="border: 1px solid #000; padding: 8px;">Data 1</td>
                    <td style="border: 1px solid #000; padding: 8px;">Data 2</td>
                    <td style="border: 1px solid #000; padding: 8px;">Data 3</td>
                    <td style="border: 1px solid #000; padding: 8px;">Data 4</td>
                    <td style="border: 1px solid #000; padding: 8px;">Data 5</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
