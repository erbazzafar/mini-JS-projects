        <button id="qrBtn">Generate QR Code</button>
        <!-- <button id="changeMode">Toggle Light/Dark Mode</button> -->
    </div>

    <script>
        const url = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=";
        const qrImg = document.querySelector("#qrImg");
        const qrBtn = document.querySelector("#qrBtn");
        const inp = document.querySelector("#inp");
        const changeMode = document.querySelector("#changeMode");

        qrBtn.addEventListener("click", () => {
            const inpData = inp.value.trim();
            if (inpData !== "") {
                qrImg.src = url + encodeURIComponent(inpData);
                inp.value = "";
            } else {
                alert("Please enter text or a URL.");
            }
        });

        let curMode = "light";
        changeMode.addEventListener("click", () => {
            const container = document.querySelector(".container");
            const title = document.querySelector(".title");

            if (curMode === "light") {
                curMode = "dark";
                container.classList.add("dark-mode");
                title.classList.add("light-text");
            } else {
                curMode = "light";
                container.classList.remove("dark-mode");
                title.classList.remove("light-text");
            }
        });
    </script>
